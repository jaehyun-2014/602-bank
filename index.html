<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#155eef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="아고라 은행">
<title>아고라 은행</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef4ff;color:#152238}
button,input{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1100px;margin:auto;padding:28px 18px 50px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:22px}.mark{width:44px;height:44px;border-radius:13px;background:#155eef;color:#fff;display:grid;place-items:center;font-weight:900}
.badge{padding:8px 12px;background:#fff;border:1px solid #dce5f5;border-radius:999px;color:#52627a;font-size:13px}
.hero{background:linear-gradient(135deg,#0d2b62,#1769e0);color:#fff;border-radius:28px;padding:48px 34px;box-shadow:0 18px 45px #174c9b26;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:1.5px;font-weight:800;opacity:.72}.hero h1{font-size:clamp(42px,8vw,72px);margin:8px 0}.hero p{font-size:18px;opacity:.88}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.btn{padding:13px 18px;border-radius:12px;font-weight:750;transition:.15s}.btn:hover{transform:translateY(-1px)}.primary{background:#fff;color:#1255c5}.blue{background:#155eef;color:#fff}.dark{background:#10294f;color:#fff}.green{background:#0e9f6e;color:#fff}.red{background:#d92d20;color:#fff}.ghost{background:#eef3fb;color:#31435e}
.notice{background:#fff8e6;border:1px solid #f4d98a;padding:12px 14px;border-radius:11px;margin-top:14px;font-size:14px}.error{background:#fff0ef;border-color:#f4b8b2;color:#b42318}
.panel{background:#fff;border:1px solid #dfe7f3;border-radius:20px;padding:22px;box-shadow:0 8px 25px #102a4d0a;margin-bottom:18px}.panel h2{margin:0 0 16px;font-size:19px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.login{max-width:500px;margin:40px auto}.login .mark{margin-bottom:18px}
input{width:100%;padding:13px 14px;border:1px solid #ccd7e7;border-radius:11px;outline:0;background:#fff;margin:6px 0 10px}input:focus{border-color:#4c8bf5;box-shadow:0 0 0 3px #4c8bf51c}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.top a{color:#1255c5;text-decoration:none;font-weight:800}.muted{color:#66758b;font-size:14px}.balance{background:linear-gradient(135deg,#123a83,#2174e8);color:#fff;border-radius:18px;padding:24px}.balance span{opacity:.75}.balance strong{display:block;font-size:34px;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid #dfe7f3;border-radius:16px;padding:18px}.stat span{display:block;color:#718096;font-size:13px}.stat b{display:block;margin-top:5px;font-size:21px}
.account{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #edf1f7}.account:last-child{border-bottom:0}.account small{display:block;color:#718096;margin-top:3px}.tx{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid #edf1f7}.tx:last-child{border-bottom:0}.tx small{display:block;color:#718096;margin-top:3px}.income{color:#087443}.expense{color:#b42318}.danger{color:#b42318;background:none;font-size:13px;font-weight:700}
footer{text-align:center;color:#7a8799;font-size:12px;margin-top:28px}.hidden{display:none!important}
@media(max-width:720px){.grid,.stats{grid-template-columns:1fr 1fr}.hero{padding:34px 24px}.hero h1{font-size:48px}}
@media(max-width:480px){.wrap{padding:18px 12px 40px}.grid,.stats{grid-template-columns:1fr}.hero{border-radius:20px}.actions .btn{width:100%}.balance strong{font-size:29px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo"><div class="mark">602</div>아고라 은행</div><button class="btn dark" onclick="show('admin')">관리자 통합뷰어</button></header>

<section id="home">
<div class="hero"><div class="eyebrow">CLASS BANKING</div><h1>아고라 은행</h1><p>우리 반 전용 가상화폐 은행</p><div class="actions"><button class="btn primary" onclick="show('student')">일반 로그인</button></div></div>
</section>

<section id="student" class="hidden">
<div class="top"><a href="#" onclick="show('home');return false">← 아고라 은행</a><b>일반 로그인</b></div>
<div id="studentLogin" class="panel login"><div class="mark">602</div><h2>내 계좌</h2><p class="muted">계좌번호, 이름, 고유번호로 본인확인</p><input id="sno" placeholder="계좌번호 602-001"><input id="sname" placeholder="이름"><input id="spin" type="password" inputmode="numeric" maxlength="8" placeholder="고유번호 4~8자리"><button class="btn blue" style="width:100%" onclick="studentLogin()">본인확인</button><div id="smsg"></div></div>
<div id="studentDash" class="hidden"></div>
</section>

<section id="admin" class="hidden">
<div class="top"><a href="#" onclick="show('home');return false">← 아고라 은행</a><b>관리자 통합뷰어</b></div>
<div id="adminLogin" class="panel login"><div class="mark">602</div><h2>관리자 확인</h2><p class="muted">관리자 코드를 입력하세요.</p><input id="apin" type="password" inputmode="numeric" placeholder="관리자 코드"><button class="btn blue" style="width:100%" onclick="adminLogin()">관리자 확인</button><div id="amsg"></div></div>
<div id="adminDash" class="hidden"></div>
</section>
<footer>아고라 은행 · 학급용 가상 시스템</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2';"></script>
<script>
const SUPABASE_URL='https://qugdtljqifagaanrelxq.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_K1mj11BXsdVYBWroata6cg_g9WKcfL4';
let supabaseClient=null;
let supabaseReady=false;
try{
  if(window.supabase&&typeof window.supabase.createClient==='function'){
    supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
    supabaseReady=true;
  }
}catch(e){
  console.error('아고라 은행 Supabase 초기화 오류:',e);
}
let currentMember=null;
let adminCode=null;

function show(id){['home','student','admin'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
function msg(id,t,err=false){const el=document.getElementById(id);if(el)el.innerHTML='<div class="notice '+(err?'error':'')+'">'+esc(t)+'</div>'}
function requireSupabase(target){
  if(supabaseReady&&supabaseClient)return true;
  msg(target,'은행 서버 연결 모듈을 불러오지 못했습니다. 페이지를 새로고침해 주세요.',true);
  return false;
}
window.addEventListener('error',function(e){
  console.error('아고라 은행 오류:',e.error||e.message);
  const target=document.getElementById('smsg')||document.getElementById('amsg');
  if(target&&!supabaseReady) msg(target,'은행 서버 연결에 실패했습니다. 페이지를 새로고침해 주세요.',true);
});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

async function studentLogin(){
 if(!requireSupabase('smsg'))return;
 const no=document.getElementById('sno').value.trim(),name=document.getElementById('sname').value.trim(),pin=document.getElementById('spin').value.trim();
 if(!no||!name||!/^[0-9]{4,8}$/.test(pin))return msg('smsg','계좌번호, 이름, 고유번호를 확인하세요.',true);
 const {data,error}=await supabaseClient.rpc('bank_member_login',{p_no:no,p_name:name,p_pin:pin});
 if(error||!data)return msg('smsg',error?.message||'본인확인에 실패했습니다.',true);
 currentMember={no,pin,account:data.account,tx:data.tx||[]};
 renderStudent();
}

function renderStudent(){
 const a=currentMember.account;
 document.getElementById('studentLogin').classList.add('hidden');
 const d=document.getElementById('studentDash');d.classList.remove('hidden');
 d.innerHTML=`
 <div class="grid">
  <div class="panel"><div class="eyebrow">MY ACCOUNT</div><h1 style="margin:5px 0">${esc(a.name)}</h1><p class="muted">${esc(a.no)}</p></div>
  <div class="balance"><span>현재 잔액</span><strong>${Number(a.balance).toLocaleString()}공</strong></div>
 </div>
 <div class="panel"><h2>입·출금</h2><p class="muted">거래 금액을 입력하세요.</p>
  <input id="amt" type="number" min="1" placeholder="금액">
  <div class="two">
   <button class="btn green" onclick="studentTx('deposit')">입금</button>
   <button class="btn red" onclick="studentTx('withdraw')">출금</button>
  </div>
  <div id="txmsg"></div>
 </div>
 <div class="panel"><h2>내 거래내역</h2><div id="history">${historyHTML(currentMember.tx)}</div></div>
 <button class="btn ghost" onclick="studentLogout()">나가기</button>`;
}

async function studentTx(type){
 if(!requireSupabase('txmsg'))return;
 const amt=Number(document.getElementById('amt').value);
 if(!Number.isInteger(amt)||amt<1)return msg('txmsg','1공 이상의 금액을 입력하세요.',true);
 const adminApproval=prompt('관리자 승인 코드를 입력하세요.');
 if(!adminApproval)return msg('txmsg','관리자 승인 코드가 필요합니다.',true);
 const {data,error}=await supabaseClient.rpc('bank_transaction',{p_no:currentMember.no,p_pin:currentMember.pin,p_type:type,p_amount:amt,p_admin_code:adminApproval.trim()});
 if(error||!data)return msg('txmsg',error?.message||'거래에 실패했습니다.',true);
 const login=await supabaseClient.rpc('bank_member_login',{p_no:currentMember.no,p_name:currentMember.account.name,p_pin:currentMember.pin});
 if(login.error||!login.data)return msg('txmsg','거래는 완료됐지만 계좌 새로고침에 실패했습니다.',true);
 currentMember.account=login.data.account;currentMember.tx=login.data.tx||[];
 renderStudent();
 msg('txmsg',type==='deposit'?'입금 완료':'출금 완료');
}

function studentLogout(){
 currentMember=null;
 document.getElementById('studentDash').classList.add('hidden');
 document.getElementById('studentLogin').classList.remove('hidden');
 document.getElementById('smsg').innerHTML='';
 document.getElementById('sno').value='';document.getElementById('sname').value='';document.getElementById('spin').value='';
}

async function adminLogin(){
 if(!requireSupabase('amsg'))return;
 const code=document.getElementById('apin').value.trim();
 if(!code)return msg('amsg','관리자 코드를 입력하세요.',true);
 const {data,error}=await supabaseClient.rpc('bank_admin_login',{p_code:code});
 if(error||data!==true)return msg('amsg',error?.message||'관리자 코드가 올바르지 않습니다.',true);
 adminCode=code;
 document.getElementById('adminLogin').classList.add('hidden');
 await adminRefresh();
}

async function adminRefresh(){
 if(!requireSupabase('amsg'))return;
 const {data,error}=await supabaseClient.rpc('bank_admin_list',{p_code:adminCode});
 if(error||!data)return msg('amsg',error?.message||'관리자 데이터를 불러오지 못했습니다.',true);
 renderAdmin(data);
}

function renderAdmin(data){
 const d=document.getElementById('adminDash');d.classList.remove('hidden');
 const accounts=data.accounts||[],all=data.transactions||[];
 const total=accounts.reduce((s,a)=>s+Number(a.balance),0);
 d.innerHTML=
 '<div class="stats"><div class="stat"><span>계좌</span><b>'+accounts.length+'개</b></div><div class="stat"><span>전체 잔액</span><b>'+total.toLocaleString()+'공</b></div><div class="stat"><span>거래</span><b>'+all.length+'건</b></div><div class="stat"><span>저장 방식</span><b>클라우드</b></div></div>'+
 '<div class="panel"><h2>회공 계좌</h2>'+(
 accounts.length?accounts.map(a=>'<div class="account"><div><b>'+esc(a.name)+'</b><small>'+esc(a.no)+'</small></div><strong>'+Number(a.balance).toLocaleString()+'공</strong><button class="danger" onclick="delAccount(\''+esc(a.no)+'\')">삭제</button></div>').join('')
 :'<p class="muted">등록된 회공 계좌가 없습니다.</p>')+'</div>'+
 '<div class="panel"><h2>회공 추가</h2><div class="grid"><input id="newname" placeholder="이름"><input id="newno" placeholder="계좌번호 602-000"><input id="newpin" type="password" inputmode="numeric" maxlength="8" placeholder="고유번호 4~8자리"><input id="newbal" type="number" min="0" value="0" placeholder="초기 잔액"></div><button class="btn blue" onclick="addAccount()">계좌 만들기</button><div id="addmsg"></div></div>'+
 '<div class="panel"><h2>전체 거래내역</h2>'+(
 all.length?all.map(t=>'<div class="tx"><span><b>'+esc(t.name)+' · '+esc(t.no)+'</b><small>'+esc(t.date)+' · '+(t.type==='deposit'?'입금':'출금')+'</small></span><strong class="'+(t.type==='deposit'?'income':'expense')+'">'+(t.type==='deposit'?'+':'-')+Number(t.amount).toLocaleString()+'공</strong></div>').join('')
 :'<p class="muted">거래내역이 없습니다.</p>')+'</div>'+
 '<button class="btn ghost" onclick="adminLogout()">잠금</button>';
}

async function addAccount(){
 if(!requireSupabase('addmsg'))return;
 const n=document.getElementById('newname').value.trim(),no=document.getElementById('newno').value.trim(),p=document.getElementById('newpin').value.trim(),b=Number(document.getElementById('newbal').value);
 if(!n||!/^[0-9]{3}$/.test(no.replace(/^602-/,''))||!/^602-[0-9]{3}$/.test(no)||!/^[0-9]{4,8}$/.test(p)||!Number.isInteger(b)||b<0)return msg('addmsg','이름, 계좌번호(602-000), 고유번호(4~8자리), 초기 잔액을 확인하세요.',true);
 const {data,error}=await supabaseClient.rpc('bank_admin_add',{p_code:adminCode,p_name:n,p_no:no,p_pin:p,p_balance:b});
 if(error||!data)return msg('addmsg',error?.message||'계좌 생성에 실패했습니다.',true);
 await adminRefresh();
}

async function delAccount(no){
 if(!requireSupabase('amsg'))return;
 if(!confirm(no+' 계좌를 삭제할까요?'))return;
 const {data,error}=await supabaseClient.rpc('bank_admin_delete',{p_code:adminCode,p_no:no});
 if(error||data!==true)return alert(error?.message||'계좌 삭제에 실패했습니다.');
 await adminRefresh();
}

function adminLogout(){
 adminCode=null;
 document.getElementById('adminDash').classList.add('hidden');
 document.getElementById('adminLogin').classList.remove('hidden');
 document.getElementById('apin').value='';
}

function historyHTML(tx){
 return tx.length?tx.map(t=>'<div class="tx"><span><b>'+(t.type==='deposit'?'입금':'출금')+'</b><small>'+esc(t.date)+'</small></span><strong class="'+(t.type==='deposit'?'income':'expense')+'">'+(t.type==='deposit'?'+':'-')+Number(t.amount).toLocaleString()+'공</strong></div>').join(''):'<p class="muted">거래내역이 없습니다.</p>'
}
</script>
</body>
</html>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => {
      console.warn('아고라 은행 service worker 등록 실패:', err);
    });
  });
}
</script>
